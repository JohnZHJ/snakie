[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snakie-fix-email"
version = "0.2.0"
description = "Local web app that rewrites workplace emails: grammar, concise, polite."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "flask>=3.0",
]

[tool.setuptools]
py-modules = ["app"]
